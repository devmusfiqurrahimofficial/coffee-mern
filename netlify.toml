[build]
  # The React app lives in the frontend folder
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single Page App: send every route to index.html so client-side
# routing (shop, product, checkout, profile, dashboard) works on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
