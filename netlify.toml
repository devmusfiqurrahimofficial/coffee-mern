[build]
  # The React app lives in the frontend folder
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single Page App: send every route to index.html so client-side
# routing (shop, product, checkout, profile, dashboard) works on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response (backend Helmet covers the API)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://coffee-mern.onrender.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://coffee-mern.onrender.com https://coffee-mern.netlify.app wss://coffee-mern.onrender.com https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"

